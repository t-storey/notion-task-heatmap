name: Update data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data.json"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch task counts from Notion
        run: node scripts/fetch.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TASKS_DB_ID: ${{ secrets.TASKS_DB_ID }}

      - name: Commit data.json if changed
        run: |
          if [ -n "$(git status --porcelain -- data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Update data.json [skip ci]"
            git push
          else
            echo "data.json unchanged; nothing to commit."
          fi
