<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Heatmap</title>
<script>
  // Runs before first paint. ?theme=dark|light pins the theme (Notion embeds
  // follow the OS scheme, not Notion's own setting); default is auto.
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "dark" || t === "light") document.documentElement.className = "theme-" + t;
  })();
</script>
<style>
  :root {
    --text: #37352f;
    --muted: #787774;
    --border: rgba(55, 53, 47, 0.16);
    --tab-hover: rgba(55, 53, 47, 0.06);
    --cell-empty: #ebedf0;
    --l1: #9be9a8;
    --l2: #40c463;
    --l3: #30a14e;
    --l4: #216e39;
    --tooltip-bg: #37352f;
    --tooltip-text: #ffffff;
  }
  /* Notion dark-mode tokens: canvas #191919, primary text 81% white,
     secondary 46%, dividers 9.4%. Applied via OS scheme unless ?theme= pins it. */
  @media (prefers-color-scheme: dark) {
    :root:not(.theme-light) {
      --text: rgba(255, 255, 255, 0.81);
      --muted: rgba(255, 255, 255, 0.46);
      --border: rgba(255, 255, 255, 0.094);
      --tab-hover: rgba(255, 255, 255, 0.055);
      --cell-empty: #252525;
      --l1: #0e4429;
      --l2: #006d32;
      --l3: #26a641;
      --l4: #39d353;
      --tooltip-bg: #2f2f2f;
      --tooltip-text: rgba(255, 255, 255, 0.9);
    }
  }
  :root.theme-dark {
    --text: rgba(255, 255, 255, 0.81);
    --muted: rgba(255, 255, 255, 0.46);
    --border: rgba(255, 255, 255, 0.094);
    --tab-hover: rgba(255, 255, 255, 0.055);
    --cell-empty: #252525;
    --l1: #0e4429;
    --l2: #006d32;
    --l3: #26a641;
    --l4: #39d353;
    --tooltip-bg: #2f2f2f;
    --tooltip-text: rgba(255, 255, 255, 0.9);
  }
  /* Auto mode stays transparent to blend into the Notion page; a pinned theme
     paints Notion's canvas color so the page also reads standalone. */
  :root.theme-dark body { background: #191919; }
  :root.theme-light body { background: #ffffff; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: transparent;
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
      Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    -webkit-font-smoothing: antialiased;
  }
  #app { padding: 6px 4px 10px; }

  /* Notion-style view tabs */
  #tabs {
    display: flex;
    gap: 2px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .tab {
    appearance: none;
    background: none;
    border: none;
    font: inherit;
    font-size: 14px;
    color: var(--muted);
    padding: 4px 8px 7px;
    cursor: pointer;
    position: relative;
    border-radius: 4px 4px 0 0;
    transition: background 60ms ease-in;
  }
  .tab:hover { background: var(--tab-hover); }
  .tab.active { color: var(--text); font-weight: 600; }
  .tab.active::after {
    content: "";
    position: absolute;
    left: 8px;
    right: 8px;
    bottom: -1px;
    height: 2px;
    background: var(--text);
    border-radius: 1px;
  }

  /* Heatmap grid */
  #scroll { overflow-x: auto; padding-bottom: 2px; }
  #chart { display: inline-block; }
  #months {
    display: grid;
    grid-template-columns: repeat(53, 11px);
    gap: 3px;
    margin-left: 30px;
    margin-bottom: 5px;
    font-size: 10px;
    color: var(--muted);
    line-height: 1;
  }
  #months span { grid-row: 1; white-space: nowrap; }
  #graph { display: flex; }
  #daylabels {
    width: 30px;
    display: grid;
    grid-template-rows: repeat(7, 11px);
    gap: 3px;
    font-size: 10px;
    color: var(--muted);
  }
  #daylabels span { line-height: 11px; }
  #grid {
    display: grid;
    grid-template-rows: repeat(7, 11px);
    grid-auto-flow: column;
    grid-auto-columns: 11px;
    gap: 3px;
  }
  .cell { width: 11px; height: 11px; border-radius: 2px; background: var(--cell-empty); }
  .cell.l1 { background: var(--l1); }
  .cell.l2 { background: var(--l2); }
  .cell.l3 { background: var(--l3); }
  .cell.l4 { background: var(--l4); }
  .cell.future { visibility: hidden; }

  #footer {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin: 10px 0 0 30px;
    font-size: 11px;
    color: var(--muted);
    min-width: 0;
  }
  #legend { display: inline-flex; align-items: center; gap: 3px; margin-left: auto; }

  #tooltip {
    position: fixed;
    display: none;
    background: var(--tooltip-bg);
    color: var(--tooltip-text);
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 4px;
    pointer-events: none;
    white-space: nowrap;
    z-index: 10;
    box-shadow: rgba(15, 15, 15, 0.2) 0 2px 8px;
  }
  #message { font-size: 13px; color: var(--muted); padding: 8px 0; }
</style>
</head>
<body>
<div id="app">
  <nav id="tabs" role="tablist" aria-label="Cofounder"></nav>
  <div id="scroll">
    <div id="chart" hidden>
      <div id="months"></div>
      <div id="graph">
        <div id="daylabels"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span></span></div>
        <div id="grid"></div>
      </div>
    </div>
  </div>
  <div id="message" hidden></div>
  <div id="footer" hidden>
    <span id="total"></span>
    <span id="updated"></span>
    <span id="legend"></span>
  </div>
</div>
<div id="tooltip" role="tooltip"></div>

<script>
(function () {
  "use strict";

  var USERS = ["tom", "ivan", "gabe"];
  var LABELS = { tom: "Tom", ivan: "Ivan", gabe: "Gabe" };
  var WEEKS = 53;
  var DAY_MS = 86400000;

  var data = null;
  var current = "tom";

  var param = new URLSearchParams(location.search).get("user");
  if (param && USERS.indexOf(param.toLowerCase()) !== -1) current = param.toLowerCase();

  var $ = function (id) { return document.getElementById(id); };

  function buildTabs() {
    var nav = $("tabs");
    nav.innerHTML = "";
    USERS.forEach(function (u) {
      var b = document.createElement("button");
      b.className = "tab" + (u === current ? " active" : "");
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", u === current ? "true" : "false");
      b.textContent = LABELS[u];
      b.addEventListener("click", function () {
        if (current === u) return;
        current = u;
        var url = new URL(location.href);
        url.searchParams.set("user", u);
        history.replaceState(null, "", url);
        buildTabs();
        render();
      });
      nav.appendChild(b);
    });
  }

  function iso(d) {
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }

  function quantile(sorted, p) {
    if (!sorted.length) return 0;
    var idx = (sorted.length - 1) * p;
    var lo = Math.floor(idx), hi = Math.ceil(idx);
    return sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
  }

  function taskWord(n) { return n === 1 ? "task" : "tasks"; }

  function render() {
    var counts = (data.users && data.users[current]) || {};

    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var mondayOffset = (today.getDay() + 6) % 7;
    var start = new Date(today.getTime() - (mondayOffset + (WEEKS - 1) * 7) * DAY_MS);

    // Quartile thresholds from this person's non-zero days (self-normalizing).
    var nonZero = [];
    var startISO = iso(start), todayISO = iso(today);
    Object.keys(counts).forEach(function (k) {
      if (counts[k] > 0 && k >= startISO && k <= todayISO) nonZero.push(counts[k]);
    });
    nonZero.sort(function (a, b) { return a - b; });
    var q1 = quantile(nonZero, 0.25), q2 = quantile(nonZero, 0.5), q3 = quantile(nonZero, 0.75);
    function level(c) {
      if (c <= 0) return 0;
      if (c <= q1) return 1;
      if (c <= q2) return 2;
      if (c <= q3) return 3;
      return 4;
    }

    var grid = $("grid");
    grid.innerHTML = "";
    var months = $("months");
    months.innerHTML = "";

    var total = 0;
    var prevMonth = -1, lastLabelCol = -10;
    var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    for (var col = 0; col < WEEKS; col++) {
      var monday = new Date(start.getTime() + col * 7 * DAY_MS);
      if (monday.getMonth() !== prevMonth) {
        if (prevMonth !== -1 && col - lastLabelCol >= 3 && WEEKS - col >= 3) {
          var label = document.createElement("span");
          label.textContent = MONTHS[monday.getMonth()];
          label.style.gridColumn = String(col + 1);
          months.appendChild(label);
          lastLabelCol = col;
        }
        prevMonth = monday.getMonth();
      }
      for (var row = 0; row < 7; row++) {
        var day = new Date(start.getTime() + (col * 7 + row) * DAY_MS);
        var cell = document.createElement("div");
        var count = counts[iso(day)] || 0;
        if (day > today) {
          cell.className = "cell future";
        } else {
          cell.className = "cell" + (count ? " l" + level(count) : "");
          cell.dataset.count = String(count);
          cell.dataset.date = day.toLocaleDateString("en-US", {
            weekday: "short", month: "short", day: "numeric"
          });
          total += count;
        }
        grid.appendChild(cell);
      }
    }

    $("total").textContent = total + " " + taskWord(total) + " in the last year";

    var legend = $("legend");
    legend.innerHTML = "";
    legend.appendChild(document.createTextNode("Less"));
    for (var l = 0; l <= 4; l++) {
      var sw = document.createElement("div");
      sw.className = "cell" + (l ? " l" + l : "");
      legend.appendChild(sw);
    }
    legend.appendChild(document.createTextNode("More"));

    var updated = $("updated");
    var gen = data.generatedAt ? new Date(data.generatedAt) : null;
    if (gen && !isNaN(gen)) {
      var mins = Math.max(0, Math.round((Date.now() - gen.getTime()) / 60000));
      var ago = mins < 1 ? "just now"
        : mins < 60 ? "updated " + mins + " min ago"
        : mins < 1440 ? "updated " + Math.round(mins / 60) + " hr ago"
        : "updated " + Math.round(mins / 1440) + " days ago";
      updated.textContent = ago;
    } else {
      updated.textContent = "";
    }

    $("chart").hidden = false;
    $("footer").hidden = false;
  }

  // Tooltip
  var tooltip = $("tooltip");
  document.addEventListener("pointerover", function (e) {
    var t = e.target;
    if (!t.classList || !t.classList.contains("cell") || !t.dataset.date) {
      tooltip.style.display = "none";
      return;
    }
    var n = Number(t.dataset.count);
    tooltip.textContent = (n ? n + " " + taskWord(n) : "No tasks") + " on " + t.dataset.date;
    tooltip.style.display = "block";
    var r = t.getBoundingClientRect();
    var tr = tooltip.getBoundingClientRect();
    var x = r.left + r.width / 2 - tr.width / 2;
    x = Math.max(4, Math.min(x, window.innerWidth - tr.width - 4));
    tooltip.style.left = x + "px";
    tooltip.style.top = Math.max(4, r.top - tr.height - 6) + "px";
  });
  document.addEventListener("pointerout", function (e) {
    if (e.target.classList && e.target.classList.contains("cell")) {
      tooltip.style.display = "none";
    }
  });

  buildTabs();
  fetch("./data.json?v=" + Date.now())
    .then(function (res) {
      if (!res.ok) throw new Error("data.json returned " + res.status);
      return res.json();
    })
    .then(function (json) {
      data = json;
      render();
    })
    .catch(function (err) {
      console.error(err);
      var msg = $("message");
      msg.textContent =
        "No data yet — the hourly refresh hasn't published data.json. Check back soon.";
      msg.hidden = false;
    });
})();
</script>
</body>
</html>
